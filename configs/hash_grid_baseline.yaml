# Hash-grid baseline based on E:/NTC/NeuralTextureTraining PytorchLite defaults.
# External reference: n_levels=7, n_features_per_level=16, base_resolution=4,
# per_level_scale=2 => finest_resolution=256, log2_hashmap_size=15,
# hidden_dim=16, num_layers=1, LeakyReLU + HardSwish, batch_size=16384.
bc_format: bc1
loss: l1

model:
  encoding: hash_grid
  hidden_dim: 16
  num_layers: 1
  activation: leaky_relu
  output_activation: hard_swish
  hash_grid:
    dim: 2
    n_levels: 7
    n_features_per_level: 16
    log2_hashmap_size: 15
    base_resolution: 4
    finest_resolution: 256

uc_training:
  total_iterations: 5000
  batch_res: 128
  lr_feat: 5.0e-3
  lr_mlp: 2.0e-3
  gamma: 1.0

bc_training:
  total_iterations: 200000
  batch_res: 128
  lr_feat: 1.0e-2
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]
  hash_grid_quant:
    bits: 4
    block_size: 0
    scale_bits: 16

bc_mlp_training:
  total_iterations: 1000
  batch_res: 128
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]

dataset:
  root: dataset

benchmark:
  warmup_iters: 5
  timing_iters: 20
  mlp_param_bits: 16
