# BC1 with MSE loss (PSNR-aligned gradient)
bc_format: bc1
loss: mse

model:
  filter: trilinear
  num_layers: 1
  half_pixel_offsets: [1, 3]
  feature_configs:
    - [512, 8, 3]
    - [256, 7, 3]
    - [128, 6, 3]
    - [64, 5, 3]
  hidden_dim: 16

uc_training:
  total_iterations: 5000
  batch_res: 128
  lr_feat: 5.0e-2
  lr_mlp: 1.0e-3
  gamma: 0.9995

bc_training:
  total_iterations: 200000
  batch_res: 128
  lr_feat: 1.0e-2
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]
bc_mlp_training:
  total_iterations: 1000
  batch_res: 128
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]


dataset:
  root: dataset
  target_res: 256

benchmark:
  warmup_iters: 5
  timing_iters: 20
  mlp_param_bits: 16
