# BC5 config — RGTC2: 8-bit端点, 3-bit索引(8级), 双通道独立BC4
bc_format: bc5
loss: l1

model:
  filter: trilinear
  num_layers: 1
  half_pixel_offsets: [1, 3]
  feature_configs:
    - [512, 8, 3]
    - [256, 7, 3]
    - [128, 6, 3]
    - [64, 5, 3]
  hidden_dim: 16

uc_training:
  total_iterations: 5000
  batch_res: 128
  lr_feat: 5.0e-2
  lr_mlp: 1.0e-3
  gamma: 0.9995

bc_training:
  total_iterations: 200000
  batch_res: 128
  lr_feat: 1.0e-2
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]
bc_mlp_training:
  total_iterations: 1000
  batch_res: 128
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]


dataset:
  root: dataset

benchmark:
  warmup_iters: 5
  timing_iters: 20
  mlp_param_bits: 16
