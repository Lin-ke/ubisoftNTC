# BC2 BCf-0.5K 配置 (NBTC 单阶段 QAT)
# BC2 (DXT3): 双块 (显式alpha 4-bit + BC1 color)

bc_format: bc2
loss: l1

model:
  filter: trilinear
  num_layers: 1
  half_pixel_offsets: [1, 3]
  feature_configs:
    - [512, 8, 3]
    - [256, 7, 3]
    - [128, 6, 3]
    - [64, 5, 3]
  hidden_dim: 16

optimizer:
  lr_feat: 1.0e-2
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]

training:
  total_iterations: 206000
  batch_res: 512
  log_interval: 1000
  output_dir: output_bc2
