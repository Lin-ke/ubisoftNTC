# BC1 BCf-0.5K 配置 (NBTC 单阶段 QAT)
# BC1 (DXT1): 2端点, 2-bit索引(4级), RGB565端点

bc_format: bc1
loss: l1

model:
  filter: trilinear
  num_layers: 1
  half_pixel_offsets: [1, 3]
  feature_configs:
    - [512, 8, 3]
    - [256, 7, 3]
    - [128, 6, 3]
    - [64, 5, 3]
  hidden_dim: 16

optimizer:
  lr_feat: 1.0e-2
  lr_mlp: 1.0e-3
  betas: [0.9, 0.999]

training:
  total_iterations: 206000
  batch_res: 512
  log_interval: 1000
  output_dir: output_bc1
